name: Deploy private workshop app

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: workshop-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build release archive
        run: tar --exclude=.git --exclude=.github --exclude=test -czf /tmp/workshop-app.tgz .
      - name: Join the tailnet with an ephemeral workload identity
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-deployer
          ping: ${{ vars.TS_DEPLOY_HOST }}
      - name: Deploy over Tailscale SSH
        env:
          TS_DEPLOY_HOST: ${{ vars.TS_DEPLOY_HOST }}
        run: |
          gzip --stdout --decompress /tmp/workshop-app.tgz |
            tailscale ssh "deploy@${TS_DEPLOY_HOST}" /home/deploy/bin/activate-workshop-release
      - name: Verify private service
        env:
          TS_DEPLOY_HOST: ${{ vars.TS_DEPLOY_HOST }}
        run: |
          tailscale ssh "deploy@${TS_DEPLOY_HOST}" \
            curl --fail --show-error --silent http://127.0.0.1:3000/health
