name: Deploy private workshop app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: workshop-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build release archive
        run: tar --exclude=.git --exclude=.github --exclude=test -czf /tmp/workshop-app.tgz .
      - name: Join the tailnet with an ephemeral workload identity
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ vars.TS_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci-deployer
      - name: Start the reviewed application
        run: |
          nohup node src/server.js >/tmp/workshop-app.log 2>&1 &
          echo $! >/tmp/workshop-app.pid
          curl --fail --retry 20 --retry-delay 1 http://127.0.0.1:3000/health
      - name: Advertise the private named service
        run: |
          tailscale serve --service=svc:workshop-app --https=443 127.0.0.1:3000
          tailscale serve status --json
      - name: Verify private service
        run: curl --fail --show-error --silent --retry 20 --retry-delay 2 "https://workshop-app.rajsingh.ts.net/health"
      - name: Keep the workshop service available
        timeout-minutes: 180
        run: |
          echo "Service is live at https://workshop-app.rajsingh.ts.net"
          while kill -0 "$(cat /tmp/workshop-app.pid)"; do
            sleep 30
          done
          cat /tmp/workshop-app.log
          exit 1
